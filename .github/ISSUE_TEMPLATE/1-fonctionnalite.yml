name: Fonctionnalité
description: Une fonctionnalité du cahier des charges à implémenter
type: Feature
assignees:
  - Emmelf
body:
  - type: dropdown
    id: fonctionnalite
    attributes:
      label: Fonctionnalité du cahier des charges
      description: La section du cahier des charges concernée.
      options:
        - F1 Comptes et authentification
        - F2 Profil et paramètres
        - "F3 Ludothèque : collection et wishlist"
        - F4 Notation
        - F5 Recherche
        - F6 Fiche jeu
        - F7 Fiches liées
        - F8 Commentaires
        - F9 Page d'accueil
        - F10 Alimentation du catalogue
        - F11 Administration
        - F12 Signalement de contenus
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Qui veut quoi, et pourquoi.
      placeholder: En tant que membre, je veux ajouter un jeu à ma wishlist afin de m'en souvenir.
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: Les conditions précises à remplir pour que la fonctionnalité soit terminée.
      placeholder: |
        - Étant donné un membre connecté sur une fiche jeu, quand il choisit Wishlist, alors le jeu apparaît dans sa wishlist
        - Étant donné un jeu dans sa collection, quand il choisit Wishlist, alors le jeu quitte la collection
        - Étant donné un visiteur non connecté, quand il choisit Wishlist, alors il est invité à se connecter
    validations:
      required: true
